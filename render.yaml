services:
  - type: web
    name: giaiolm-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /api/ready
    # Sau này khi mua tên miền riêng, bỏ dấu # 2 dòng dưới và đổi thành tên miền của bạn:
    # domains:
    #   - api.giaiolm.com
    envVars:
      # Dán Connection String miễn phí từ Neon.tech hoặc Supabase vào đây:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://sub.digishop.work/v1
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: PUBLIC_ORIGINS
        value: https://giaiolm.com,https://www.giaiolm.com
      - key: ALLOW_VERCEL_ORIGINS
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: PUPPETEER_NO_SANDBOX
        value: "true"
      - key: WORKER_RUN_SLOTS
        value: "1"
      - key: WORKER_HOMEWORK_CONCURRENCY
        value: "1"
      - key: DB_POOL_SIZE
        value: "5"
      - key: MAX_QUEUED_RUNS
        value: "50"
      - key: UPSTREAM_REQUEST_SLOTS
        value: "6"
