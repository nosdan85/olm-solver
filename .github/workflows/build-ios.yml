name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS App (Unsigned for Sideload / AltStore / TrollStore)
        run: |
          cd ios/App
          xcodebuild -list
          xcodebuild -project App.xcodeproj -scheme App -resolvePackageDependencies
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./DerivedData \
            SYMROOT="$(pwd)/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package App into Payload / IPA
        run: |
          cd ios/App
          mkdir -p Payload
          APP_PATH=$(find ./build ./DerivedData -type d -name "App.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app not found!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -q OLM-Solver.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OLM-Solver-iOS-IPA
          path: ios/App/OLM-Solver.ipa
          retention-days: 30

      - name: Create or Update GitHub Release with IPA
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-ios
          name: "OLM Solver iOS (IPA) - Local PC Edition"
          body: |
            ### 📱 Cài đặt OLM Solver trên iPhone / iPad (.ipa)
            - **Phiên bản:** Local 100% PC Server Edition
            - **Mạng hỗ trợ:** Bất kỳ mạng nào (4G, 5G, Wi-Fi ngoài) kết nối trực tiếp về PC qua Cloudflare Tunnel.
            - **Cách cài đặt:**
              1. Tải file `OLM-Solver.ipa` bên dưới.
              2. Cài qua **AltStore**, **Sideloadly**, **TrollStore**, hoặc **Scarlet**.
              3. Mở app trên iPhone, app sẽ tự kết nối tới server PC của bạn.
          files: ios/App/OLM-Solver.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
