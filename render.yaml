services:
  - type: web
    name: olm-solver-backend
    env: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: OPENAI_MODEL
        value: gemini-3.8-flash
      - key: PUPPETEER_HEADLESS
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
